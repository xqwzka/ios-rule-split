rules:
  # 本地规则（和 QX [filter_local] 一致，优先于订阅规则）
  - DOMAIN,cloud.oracle.com,DIRECT
  - DOMAIN,hkextshort.weixin.qq.com,DIRECT
  - DOMAIN-KEYWORD,nodeseek,日本
  - DOMAIN-KEYWORD,clubsim,香港
  - DOMAIN,df.link8.top,DIRECT
  - DOMAIN,ad.12306.cn,DIRECT
  - DOMAIN,sdkapp.uve.weibo.com,DIRECT
  - DOMAIN-KEYWORD,github,PROXY
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/24,DIRECT,no-resolve
  - IP-CIDR,182.254.116.0/24,DIRECT,no-resolve
  # 订阅规则（和 QX [filter_remote] 同顺序）
  - RULE-SET,exchange,日本
  - RULE-SET,ios-update,REJECT
  - RULE-SET,telegram-sg,日本
  - RULE-SET,telegram-us,美国
  - RULE-SET,telegram,Telegram
  - RULE-SET,adblock4limbo,REJECT
  - RULE-SET,dyip-direct,DIRECT
  - RULE-SET,dyip-proxy,PROXY
  - RULE-SET,meat,ig
  - RULE-SET,google,美国
  - RULE-SET,ai,PROXY
  - RULE-SET,emby,emby
  - RULE-SET,apple-push,PROXY
  - RULE-SET,apple,DIRECT
  - RULE-SET,hongguo-direct,DIRECT
  - RULE-SET,hongguo,REJECT
  - RULE-SET,adblock-direct,DIRECT
  - RULE-SET,adblock,REJECT
  - RULE-SET,global-direct,DIRECT
  - RULE-SET,global-proxy,PROXY
  # CN 兜底放最后：具体规则优先，匹配不到的国内 IP 再直连
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
